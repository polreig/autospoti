name: Actualizar playlists automáticas

# Con el secret DATABASE_URL (Postgres en la nube):
#   * cada hora      -> python cron.py --record   (registra tus escuchas; nunca se pierden)
#   * cada día 04:00 -> python cron.py            (registra + actualiza las 5 playlists)
# Sin DATABASE_URL (modo antiguo): solo la ejecución diaria con --api-only (3 playlists).

on:
  schedule:
    - cron: "17 * * * *"  # registro cada hora (minuto 17: evita el pico de las en punto)
    - cron: "0 4 * * *"   # playlists cada día a las 04:00 UTC
  workflow_dispatch:       # botón "Run workflow" en la pestaña Actions
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        options: [completo, registro]
        default: completo

permissions:
  contents: read

concurrency:
  group: update-playlists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Decidir qué ejecutar
        id: plan
        env:
          HAS_DB: ${{ secrets.DATABASE_URL != '' }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          hourly=false
          if [ "$SCHEDULE" = "17 * * * *" ] || [ "$MODE" = "registro" ]; then hourly=true; fi
          if [ "$HAS_DB" = true ]; then
            if [ "$hourly" = true ]; then args="--record"; else args=""; fi
          elif [ "$hourly" = true ]; then
            echo "Sin el secret DATABASE_URL no hay registro horario (no hay dónde guardarlo)."
            args="skip"
          else
            args="--api-only"
          fi
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.plan.outputs.args != 'skip'

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.args != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.plan.outputs.args != 'skip'
        run: pip install -r requirements.txt

      - name: Ejecutar
        if: steps.plan.outputs.args != 'skip'
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIFY_CACHE: ${{ secrets.SPOTIFY_CACHE }}           # solo se usa la primera vez
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          HISTORY_ENABLED: ${{ secrets.DATABASE_URL != '' && 'true' || 'false' }}
        run: python cron.py ${{ steps.plan.outputs.args }}
